<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceCode Remote Log Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .controls button {
            padding: 8px 16px;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .controls button:hover {
            background: #005a9e;
        }
        .log-container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-height: 70vh;
            overflow-y: auto;
        }
        .log-entry {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .log-entry.error {
            background: #fee;
            color: #c00;
        }
        .log-entry.warn {
            background: #ffd;
            color: #880;
        }
        .log-entry.info {
            color: #008;
        }
        .log-entry.debug {
            color: #666;
        }
        .timestamp {
            color: #888;
            margin-right: 10px;
        }
        .level {
            font-weight: bold;
            margin-right: 10px;
            text-transform: uppercase;
        }
        .device-info {
            background: #e3f2fd;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border-radius: 20px;
            font-size: 14px;
        }
        .status.disconnected {
            background: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VoiceCode Remote Log Viewer</h1>
        <div class="controls">
            <button onclick="clearLogs()">Clear Logs</button>
            <button onclick="toggleAutoScroll()">Toggle Auto-Scroll: <span id="autoScrollStatus">ON</span></button>
            <input type="text" id="filterInput" placeholder="Filter logs..." onkeyup="filterLogs()" style="flex: 1; padding: 8px;">
        </div>
        <div id="logContainer" class="log-container">
            <div style="color: #666; text-align: center; padding: 40px;">
                Waiting for logs...
            </div>
        </div>
        <div id="status" class="status disconnected">
            Waiting for logs...
        </div>
    </div>

    <script>
        let logs = [];
        let autoScroll = true;
        let deviceInfo = null;
        
        // Simple in-memory log storage
        window.logStorage = [];
        
        // Create a simple endpoint for receiving logs
        window.receiveLogs = function(data) {
            if (data.device) {
                deviceInfo = data.device;
            }
            
            if (data.logs) {
                logs.push(...data.logs);
                window.logStorage.push(...data.logs);
                renderLogs();
                updateStatus();
            }
        };
        
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString();
        }
        
        function renderLogs() {
            const container = document.getElementById('logContainer');
            const filter = document.getElementById('filterInput').value.toLowerCase();
            
            let html = '';
            
            if (deviceInfo) {
                html += `<div class="device-info">
                    <strong>Device:</strong> ${deviceInfo.platform} | 
                    <strong>Browser:</strong> ${deviceInfo.vendor} | 
                    <strong>Language:</strong> ${deviceInfo.language} | 
                    <strong>Screen:</strong> ${deviceInfo.screenResolution} | 
                    <strong>Mobile:</strong> ${deviceInfo.isMobile ? 'Yes' : 'No'}
                </div>`;
            }
            
            const filteredLogs = logs.filter(log => {
                if (!filter) return true;
                return log.message.toLowerCase().includes(filter) || 
                       (log.data && JSON.stringify(log.data).toLowerCase().includes(filter));
            });
            
            filteredLogs.forEach(log => {
                const dataStr = log.data ? ' - ' + JSON.stringify(log.data) : '';
                html += `<div class="log-entry ${log.level}">
                    <span class="timestamp">${formatTime(log.timestamp)}</span>
                    <span class="level">[${log.level}]</span>
                    ${log.message}${dataStr}
                </div>`;
            });
            
            container.innerHTML = html || '<div style="color: #666; text-align: center; padding: 40px;">No logs yet...</div>';
            
            if (autoScroll) {
                container.scrollTop = container.scrollHeight;
            }
        }
        
        function clearLogs() {
            logs = [];
            window.logStorage = [];
            deviceInfo = null;
            renderLogs();
        }
        
        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            document.getElementById('autoScrollStatus').textContent = autoScroll ? 'ON' : 'OFF';
        }
        
        function filterLogs() {
            renderLogs();
        }
        
        function updateStatus() {
            const status = document.getElementById('status');
            status.textContent = `Connected - ${logs.length} logs`;
            status.className = 'status';
            
            // Reset to disconnected after 30 seconds of no activity
            clearTimeout(window.statusTimeout);
            window.statusTimeout = setTimeout(() => {
                status.textContent = 'No recent activity';
                status.className = 'status disconnected';
            }, 30000);
        }
        
        // Check for logs in localStorage every second (fallback method)
        setInterval(() => {
            const storedLogs = localStorage.getItem('voiceCodeLogs');
            if (storedLogs) {
                try {
                    const parsed = JSON.parse(storedLogs);
                    if (parsed.length > logs.length) {
                        logs = parsed;
                        renderLogs();
                        updateStatus();
                    }
                } catch (e) {}
            }
        }, 1000);
    </script>
</body>
</html>
